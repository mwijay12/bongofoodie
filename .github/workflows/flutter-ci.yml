name: Flutter Mobile CI & APK Showcase Build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-flutter:
    name: Analyze, Test & Build Bongo Foodie APK + Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Hydrate Native Platform Runners (Android, iOS, Web)
        run: |
          flutter create --platforms=android,ios,web --org tz.co.bongofoodie --project-name bongo_foodie .
          rm -f test/widget_test.dart
          python3 scripts/apply_branding.py
          python3 scripts/test_branding.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Emoji guard (UI copy and showcase seed)
        run: bash "$GITHUB_WORKSPACE/scripts/check_emoji.sh"

      - name: Record main analyzer baseline
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/bongo-main FETCH_HEAD
          cd /tmp/bongo-main/mobile
          flutter create --platforms=android,ios,web --org tz.co.bongofoodie --project-name bongo_foodie .
          rm -f test/widget_test.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/bongo-baseline.log 2>&1 || true
          warnings=$(grep -c 'warning •' /tmp/bongo-baseline.log || true)
          infos=$(grep -c 'info •' /tmp/bongo-baseline.log || true)
          errors=$(grep -c 'error •' /tmp/bongo-baseline.log || true)
          echo "::notice::Main analyzer baseline: $warnings warnings, $infos infos, $errors errors"

      - name: Static Analysis
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/flutter-analysis.log 2>&1 || {
            cat /tmp/flutter-analysis.log
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep 'error •' /tmp/flutter-analysis.log || tail -20 /tmp/flutter-analysis.log)
            exit 1
          }
          cat /tmp/flutter-analysis.log
          warnings=$(grep -c 'warning •' /tmp/flutter-analysis.log || true)
          infos=$(grep -c 'info •' /tmp/flutter-analysis.log || true)
          echo "::notice::Branch analyzer: $warnings warnings, $infos infos"
          grep -E '(warning|info) •.*(app_shell|app_sheet|bongo_glass_nav_bar|tanzania_location_sheet|cart_screen|chef_ai_screen|home_screen|search_menu_screen|dish_detail_sheet|onboarding_screen|profile_screen|app_router|app_tokens|app_colors|shell_navigation_test|auth_entry_screen|auth_guest_test|auth_repository|auth_validation|auth_provider)' /tmp/flutter-analysis.log | head -9 | while IFS= read -r line; do echo "::warning::$line"; done || true

      - name: Run Unit Tests
        run: |
          flutter test --reporter expanded > /tmp/flutter-tests.log 2>&1 || {
            cat /tmp/flutter-tests.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep '\[E\]' /tmp/flutter-tests.log | head -3)
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'overflowed by|Expected:|Actual:|Which:|test assertion|following.*thrown|When the exception|#[0-9]+.*promo_offer' /tmp/flutter-tests.log | head -12)
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E '#[0-9]+.*(promo_offer_card_test|home_polish_test)\.dart' /tmp/flutter-tests.log | head -3)
            exit 1
          }
          cat /tmp/flutter-tests.log

      - name: Build Release Android APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://ovdozsryglkljcugdnkz.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Mgy_bwv99mDM-2-O1S07Nw_-53184VK \
            --dart-define=WEB_API_BASE_URL=${{ secrets.WEB_API_BASE_URL }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-foodie-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Flutter Web Showcase
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://ovdozsryglkljcugdnkz.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Mgy_bwv99mDM-2-O1S07Nw_-53184VK \
            --dart-define=WEB_API_BASE_URL=${{ secrets.WEB_API_BASE_URL }}

      - name: Upload Flutter Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-foodie-flutter-web
          path: mobile/build/web
          retention-days: 14
