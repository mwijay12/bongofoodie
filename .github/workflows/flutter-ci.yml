name: Flutter Mobile CI & APK Showcase Build

on:
  # Runs on main and on PRs that touch mobile code. It deliberately does NOT
  # run on every push to a working branch: that burned ~4 min of runner time
  # per commit with no extra signal. Trigger it by hand when you need a build.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why you are building (shown in the run list)'
        required: false
        default: 'manual build'

jobs:
  build-flutter:
    name: Analyze, Test & Build Bongo Foodie APK + Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Hydrate Native Platform Runners (Android, iOS, Web)
        run: |
          flutter create --platforms=android,ios,web --org tz.co.bongofoodie --project-name bongo_foodie .
          rm -f test/widget_test.dart
          python3 scripts/apply_branding.py
          python3 scripts/test_branding.py
          python3 scripts/test_location_permissions.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Emoji guard (UI copy and showcase seed)
        run: bash "$GITHUB_WORKSPACE/scripts/check_emoji.sh"

      - name: Verify dish cutouts are normalised
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          python3 scripts/normalize_dish_cutouts.py --check

      - name: Record main analyzer baseline
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/bongo-main FETCH_HEAD
          cd /tmp/bongo-main/mobile
          flutter create --platforms=android,ios,web --org tz.co.bongofoodie --project-name bongo_foodie .
          rm -f test/widget_test.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/bongo-baseline.log 2>&1 || true
          warnings=$(grep -c 'warning •' /tmp/bongo-baseline.log || true)
          infos=$(grep -c 'info •' /tmp/bongo-baseline.log || true)
          errors=$(grep -c 'error •' /tmp/bongo-baseline.log || true)
          echo "::notice::Main analyzer baseline: $warnings warnings, $infos infos, $errors errors"

      - name: Static Analysis
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/flutter-analysis.log 2>&1 || {
            cat /tmp/flutter-analysis.log
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep 'error •' /tmp/flutter-analysis.log || tail -20 /tmp/flutter-analysis.log)
            exit 1
          }
          cat /tmp/flutter-analysis.log
          warnings=$(grep -c 'warning •' /tmp/flutter-analysis.log || true)
          infos=$(grep -c 'info •' /tmp/flutter-analysis.log || true)
          echo "::notice::Branch analyzer: $warnings warnings, $infos infos"
          grep -E '(warning|info) •.*(app_shell|app_sheet|bongo_glass_nav_bar|tanzania_location_sheet|cart_screen|chef_ai_screen|home_screen|search_menu_screen|dish_detail_sheet|onboarding_screen|profile_screen|app_router|app_tokens|app_colors|shell_navigation_test|auth_entry_screen|auth_guest_test|auth_repository|auth_validation|auth_provider|reward_repository|cart_provider|menu_repository)' /tmp/flutter-analysis.log | head -9 | while IFS= read -r line; do echo "::warning::$line"; done || true

      - name: Run Unit Tests
        run: |
          flutter test --reporter expanded > /tmp/flutter-tests.log 2>&1 || {
            cat /tmp/flutter-tests.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep '\[E\]' /tmp/flutter-tests.log | head -3)
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -A 18 'The following' /tmp/flutter-tests.log | head -20)
            exit 1
          }
          cat /tmp/flutter-tests.log

      - name: Verify configured live checkout fails closed
        run: >-
          flutter test test/live_checkout_gate_test.dart
          --dart-define=SUPABASE_URL=https://checkout-test.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=test-only-non-secret-publishable

      - name: Resolve Supabase build configuration
        id: sb
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing. Refusing to build an APK that would silently run in showcase mode."
            exit 1
          fi
          echo "host=${SB_URL#https://}" >> "$GITHUB_OUTPUT"

      - name: Build Release Android APK
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SB_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SB_KEY" \
            --dart-define=WEB_API_BASE_URL=${{ secrets.WEB_API_BASE_URL }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-foodie-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Flutter Web Showcase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SB_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SB_KEY" \
            --dart-define=WEB_API_BASE_URL=${{ secrets.WEB_API_BASE_URL }}

      - name: Upload Flutter Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-foodie-flutter-web
          path: mobile/build/web
          retention-days: 14
