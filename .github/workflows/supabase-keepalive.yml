name: Supabase Keep-Alive Heartbeat

# Supabase Free Tier pauses a project after ~7 days without activity.
# This runs every 12 hours so there are ~14 chances before that window closes,
# and it verifies the write actually landed instead of assuming a 200 is enough.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL      - https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY - publishable / anon key for that project
#
# If the secrets are absent the job fails loudly rather than silently "passing".

on:
  schedule:
    # Every 12 hours: 05:00 and 17:00 UTC (08:00 and 20:00 EAT).
    - cron: '0 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-supabase:
    name: Heartbeat and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify keep-alive secrets are configured
        shell: bash
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing. The project is NOT being kept alive."
            exit 1
          fi
          echo "Secrets present. Host: ${URL#https://}"

      - name: Heartbeat (RPC, with REST fallback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_SOURCE: github-actions-schedule
        run: node scripts/keepalive-ping.js

      - name: Confirm the project answered after the heartbeat
        shell: bash
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 "$URL/auth/v1/health" -H "apikey: $KEY")
          echo "auth health: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Project did not answer a health check (HTTP $code). It may be paused already."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 "$URL/rest/v1/menu?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "menu read: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Menu read failed (HTTP $code). Schema may be missing; run 'Supabase database setup'."
            exit 1
          fi
