name: Web customer UI

on:
  push:
    branches: [main, 'arena/**']
    paths: ['web/**', '.github/workflows/web-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ui.yml']

jobs:
  customer-home:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint customer Home changes
        run: >-
          npx eslint
          src/app/page.tsx
          src/app/layout.tsx
          src/components/Navbar.tsx
          src/components/SwahiliTrivia.tsx
          src/lib/imageMap.ts
          src/lib/appRelease.ts
          tests/home.spec.ts
          playwright.config.ts
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-ui-test-results
          path: web/test-results/
          retention-days: 7
