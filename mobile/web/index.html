<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BongoFoodie TZ — Authentic Swahili Gastronomy & Chef AI Flutter App">
  <meta name="theme-color" content="#F6821F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BongoFoodie">
  <link rel="manifest" href="manifest.json">
  <title>BongoFoodie TZ — Flutter Mobile</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #120D09;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #bongo-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #FFFFFF;
      background: radial-gradient(circle at center, #26160B 0%, #120D09 100%);
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    .bongo-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3.5px solid rgba(246, 130, 31, 0.22);
      border-top-color: #F6821F;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="bongo-boot">
    <div class="bongo-spinner"></div>
    <div style="font-weight: 800; font-size: 18px; letter-spacing: -0.3px;">BongoFoodie TZ</div>
    <div style="font-size: 12px; color: rgba(255,255,255,0.68);">Loading Flutter Swahili Kitchen...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('bongo-boot');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 380);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
