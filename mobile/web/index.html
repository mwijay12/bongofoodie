<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BongoFoodie TZ — Authentic Swahili Gastronomy & Chef AI Flutter App">
  <meta name="theme-color" content="#F58220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BongoFoodie">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>BongoFoodie TZ — Flutter Mobile</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1A100B;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #bongo-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #FFFFFF;
      background: #1A100B;
      z-index: 9999;
      transition: opacity 0.28s ease;
    }
    .bongo-brand {
      width: 192px;
      height: 192px;
      object-fit: contain;
    }
    @media (prefers-reduced-motion: reduce) {
      #bongo-boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="bongo-boot">
    <img class="bongo-brand" src="icons/Icon-192.png" alt="BongoFoodie">
    <div style="font-weight: 800; font-size: 18px; letter-spacing: -0.3px;">BongoFoodie TZ</div>
    <div style="font-size: 12px; color: rgba(255,255,255,0.68);">Loading Flutter Swahili Kitchen...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('bongo-boot');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 280);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
