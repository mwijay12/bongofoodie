<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Bongo Foodie</title>
  <defs>
    <linearGradient id="bowl" x1="12" y1="28" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F58220"/>
